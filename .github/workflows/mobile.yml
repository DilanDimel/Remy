name: Mobile apps
# Builds the iPhone and Android shells (see docs/mobile-app.md). The Android
# debug APK is attached to each run so it can be installed on a phone for testing.
on:
  push:
    paths: ["android/**", "ios/**", "capacitor.config.ts", "mobile/**", "client/src/lib/native.ts", "package.json", "package-lock.json", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["android/**", "ios/**", "capacitor.config.ts", "mobile/**", "client/src/lib/native.ts", "package.json", "package-lock.json", ".github/workflows/mobile.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: remy-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40; test ${PIPESTATUS[0]} -eq 0
