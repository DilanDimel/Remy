name: Checks
# Runs on pull requests and on main only (not every branch push), so each change is checked once.
on:
  push:
    branches: [main]
  pull_request:
  merge_group: # GitHub merge queue, if it is ever turned on for main
# A newer push to the same pull request cancels the older run, so stale commits don't send failure emails. Main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:ai diffs the PR against its base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Client/server contract
        run: npm run check:contract
      - name: Tests (claim checker, eligibility)
        run: npm test
      - name: AI teamwork rules (owned files, claims, status file)
        if: github.event_name == 'pull_request'
        run: npm run check:ai
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
