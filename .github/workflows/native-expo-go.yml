name: Native app in Expo Go
# Opens the app in the real Expo Go on an Android emulator and checks it gets past the splash screen
# (Dilan saw only Remy on a white screen, Nov 22). Uploads a screenshot and the app's logs.
on:
  push:
    paths: ["native/**", ".github/workflows/native-expo-go.yml"]
  workflow_dispatch:
jobs:
  expo-go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: native/package-lock.json }
      - run: npm ci
        working-directory: native
      - name: Download Expo Go for this SDK
        run: |
          url=$(curl -s https://api.expo.dev/v2/versions/latest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s).data.sdkVersions[require("./native/node_modules/expo/package.json").version.split(".")[0]+".0.0"];console.log(v.androidClientUrl)})')
          echo "Expo Go: $url"; curl -sL "$url" -o expo-go.apk
      - name: Start the app's dev server
        working-directory: native
        run: |
          (CI=1 npx expo start --port 8081 --no-dev --minify > ../metro.log 2>&1 &) ; for i in $(seq 1 60); do curl -s localhost:8081/status | grep -q running && break; sleep 2; done; curl -s localhost:8081/status
          # Bundle once up front (it takes ~90 s) so Expo Go doesn't time out waiting for it
          b=$(curl -s -H 'expo-platform: android' -H 'accept: application/expo+json,application/json' localhost:8081 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log(m.launchAsset?.url||m.bundleUrl)})')
          echo "bundle url: $b"; curl -s -o /dev/null -w 'bundle %{http_code} %{size_download} bytes in %{time_total}s\n' "$b"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Open it in Expo Go
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r expo-go.apk
            adb reverse tcp:8081 tcp:8081
            adb shell am start -a android.intent.action.VIEW -d "exp://127.0.0.1:8081" host.exp.exponent
            for i in $(seq 1 36); do sleep 5; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1; echo "after $((i*5))s: $(grep -o 'text="[^"]\+"' ui.xml | head -8 | tr '\n' ' ')"; grep -q 'developer menu' ui.xml && adb shell input keyevent 4; grep -qi 'Welcome to Remy\|Email me a code\|Good morning\|Today' ui.xml && break; done; true
            adb exec-out screencap -p > expo-go.png
            echo "Text on screen:"; grep -o 'text="[^"]\+"' ui.xml | head -30 || true
            adb logcat -d | grep -iE 'ReactNativeJS|exponent|expo|AndroidRuntime|Exception' | grep -v ' D ' | tail -n 120
            grep -qi 'Welcome to Remy\|Email me a code' ui.xml && echo "EXPO GO OK: the sign-in screen is showing" || echo "NOT OK on the local build"
            echo "---- Now the published preview update (what Dilan opens) ----"; adb logcat -c; adb shell am force-stop host.exp.exponent
            adb shell am start -a android.intent.action.VIEW -d "exp://u.expo.dev/c31ef8cb-8425-4208-8dfa-bb9ce75864b5?channel-name=preview" host.exp.exponent
            for i in $(seq 1 24); do sleep 5; adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1; adb pull /sdcard/ui.xml ui2.xml >/dev/null 2>&1; echo "published, after $((i*5))s: $(grep -o 'text="[^"]\+"' ui2.xml | head -8 | tr '\n' ' ')"; grep -qi 'Welcome to Remy\|Email me a code\|went wrong' ui2.xml && break; done; true
            adb exec-out screencap -p > published.png
            adb logcat -d | grep -iE 'ReactNativeJS|exponent|expo|AndroidRuntime|Exception' | grep -v ' D ' | tail -n 120
            grep -qi 'Welcome to Remy\|Email me a code' ui.xml
      - name: Dev server log
        if: always()
        run: tail -n 60 metro.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-go-screenshot
          path: |
            expo-go.png
            published.png
            ui2.xml
            ui.xml
            metro.log

  # Same check on an iPhone simulator with the published preview, since Dilan may be on iOS.
  ios-published:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Open the published preview in Expo Go on an iPhone simulator
        run: |
          url=$(curl -s https://api.expo.dev/v2/versions/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["data"]["sdkVersions"]["58.0.0"]["iosClientUrl"])')
          echo "Expo Go: $url"; mkdir -p ExpoGo.app && curl -sL "$url" | tar -xz -C ExpoGo.app
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for k in sorted(d,reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" ExpoGo.app
          open -a Simulator; sleep 5
          xcrun simctl openurl "$udid" "exp://u.expo.dev/c31ef8cb-8425-4208-8dfa-bb9ce75864b5?channel-name=preview"
          # iOS asks 'Open in "Expo Go"?'; Return presses the default Open button
          sleep 4; osascript -e 'tell application "Simulator" to activate' -e 'delay 1' -e 'tell application "System Events" to key code 36' || echo "could not press Open"
          mkdir -p shots; for t in 10 20 30 45 60 90 120; do sleep 10; xcrun simctl io "$udid" screenshot "shots/ios-${t}s.png" >/dev/null 2>&1; done
          xcrun simctl spawn "$udid" log show --last 3m --predicate 'process == "Expo Go" AND (messageType == error OR eventMessage CONTAINS[c] "error")' 2>/dev/null | tail -n 80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-screens, path: shots }
