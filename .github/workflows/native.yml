name: Native app
on:
  push:
    branches: [main]
    paths: ["native/**", "shared/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "shared/**", ".github/workflows/native.yml"]
# A newer push to the same pull request cancels the older run, so stale commits don't send failure emails. Main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - name: Type check (app + shared code it imports)
        run: npm run check
      - name: Tests
        run: npm test
      - name: Bundles for iPhone and Android
        run: npx expo export --platform ios --platform android --output-dir /tmp/native-export
