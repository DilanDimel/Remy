# Wakes Remy every hour so its background jobs run even when no student has it open (a sleeping free Render
# server otherwise only runs them when someone visits): deadline reminders, the weekly digest, guest cleanup.
# Needs two repository settings: secret CRON_SECRET (same value as the server's CRON_SECRET env var) and
# variable REMY_URL (e.g. https://offer-ready-w2ug.onrender.com). GitHub runs schedules from the default branch only.
name: Hourly tick
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/tick (allows for a cold start)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMY_URL: ${{ vars.REMY_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$REMY_URL" ]; then echo "CRON_SECRET or REMY_URL not set; skipping"; exit 0; fi
          # --retry covers a sleeping server waking up (timeouts, 502/503); a wrong secret (401) fails at once.
          curl -fsS --retry 4 --retry-delay 20 --retry-connrefused --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$REMY_URL/api/cron/tick"
