services:
  - type: web
    name: offer-ready
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    healthCheckPath: /api/config
    # No persistent disk: Render can't do zero-downtime deploys with one attached. The database is Supabase and the
    # workspace cache is in Cloudflare R2 (server/platform/r2.ts; R2_* and WS_CACHE_KEY are set in the dashboard).
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OR_AI_CHAIN
        value: openrouter:anthropic/claude-haiku-5.5,openrouter:google/gemini-3.8-flash,openrouter:openai/gpt-5-mini
      # Every OpenRouter call uses zero-data-retention providers only (privacyRouting in server/ai/ai.ts).
      - key: OR_AI_PRIVACY
        value: "on"
      # Optional: a stronger model for resume tailoring only (team decision; costs more per call).
      # Example: openrouter:openai/gpt-5.1,openrouter:google/gemini-3.8-flash
      # - key: OR_AI_TAILOR_CHAIN
      #   value: ""
      # Supabase Auth (sign-in + LinkedIn connector). Both values are public:
      # the publishable key is meant to ship to browsers. Never put the secret key here.
      - key: SUPABASE_URL
        value: https://vpfnawzbzxxkcylktbxn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_Fgz0suQY9cSbrVD7pKEsMA_5ximdZgj
      # Secrets: entered in the Render dashboard, never committed.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
