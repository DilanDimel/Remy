services:
  - type: web
    name: offer-ready
    runtime: node
    plan: starter # persistent disks require a paid plan
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    healthCheckPath: /api/config
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OR_DB_PATH
        value: /data/data.db
      # Free OpenRouter models first (1,000 free requests a day on this account); the paid Gemini Flash
      # only runs if every free model is down or busy. Free models change often: re-check at openrouter.ai/models?q=free.
      - key: OR_AI_CHAIN
        value: openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,openrouter:google/gemma-4-31b-it:free,openrouter:dots-studio/dots-3-note-preview:free,openrouter:google/gemini-3.8-flash,gemini:gemini-3.8-flash
      # Optional: a stronger model for resume tailoring only (team decision; costs more per call).
      # Example: openrouter:openai/gpt-5.1,openrouter:google/gemini-3.8-flash
      # - key: OR_AI_TAILOR_CHAIN
      #   value: ""
      # Supabase Auth (sign-in + LinkedIn connector). Both values are public:
      # the publishable key is meant to ship to browsers. Never put the secret key here.
      - key: SUPABASE_URL
        value: https://vpfnawzbzxxkcylktbxn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_Fgz0suQY9cSbrVD7pKEsMA_5ximdZgj
      # Secrets: entered in the Render dashboard, never committed.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
