# Preview of the private fixes branch, separate from the live offer-ready service.
# Render: New → Blueprint → repo Remy-dilan → Blueprint path: render-preview.yaml.
# Data lives in Supabase Postgres (DATABASE_URL), so accounts survive sleeps and redeploys.
services:
  - type: web
    name: remy-preview
    runtime: node
    plan: free
    branch: fix/section-f-housekeeping
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OR_AI_CHAIN
        value: openrouter:google/gemini-3.8-flash,openrouter:openai/gpt-5-mini
      - key: SUPABASE_URL
        value: https://vpfnawzbzxxkcylktbxn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_Fgz0suQY9cSbrVD7pKEsMA_5ximdZgj
      # Secret: Render asks for it when you create the Blueprint. Never committed.
      - key: OPENROUTER_API_KEY
        sync: false
      # Database: Supabase Postgres, private schema remy_preview, its own least-privilege login.
      # DATABASE_URL is secret (in Dilan's ~/Remy/.env as PREVIEW_DATABASE_URL). Any Postgres works here.
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: remy_preview
      - key: DB_SSL_CA_FILE
        value: server/certs/supabase-prod-ca-2021.crt
