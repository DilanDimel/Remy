# Preview of the private fixes branch, separate from the live offer-ready service.
# Render: New → Blueprint → repo Remy-dilan → Blueprint path: render-preview.yaml.
# Free plan: no persistent disk, so data resets when the service sleeps or redeploys.
services:
  - type: web
    name: remy-preview
    runtime: node
    plan: free
    branch: fix/section-f-housekeeping
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Free OpenRouter models first (1,000 free requests a day on this account); the paid Gemini Flash
      # only runs if every free model is down or busy. Free models change often: re-check at openrouter.ai/models?q=free.
      - key: OR_AI_CHAIN
        value: openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,openrouter:google/gemma-4-31b-it:free,openrouter:dots-studio/dots-3-note-preview:free,openrouter:google/gemini-3.8-flash
      - key: SUPABASE_URL
        value: https://vpfnawzbzxxkcylktbxn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_Fgz0suQY9cSbrVD7pKEsMA_5ximdZgj
      # Secret: Render asks for it when you create the Blueprint. Never committed.
      - key: OPENROUTER_API_KEY
        sync: false
