# Preview of the private fixes branch, separate from the live offer-ready service.
# Render: New → Blueprint → repo Remy-dilan → Blueprint path: render-preview.yaml.
# Free plan: no persistent disk, so data resets when the service sleeps or redeploys.
services:
  - type: web
    name: remy-preview
    runtime: node
    plan: free
    branch: fix/section-f-housekeeping
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production node dist/index.cjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OR_AI_CHAIN
        value: openrouter:google/gemini-3.8-flash,openrouter:openai/gpt-5-mini
      - key: SUPABASE_URL
        value: https://vpfnawzbzxxkcylktbxn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_Fgz0suQY9cSbrVD7pKEsMA_5ximdZgj
      # Secret: Render asks for it when you create the Blueprint. Never committed.
      - key: OPENROUTER_API_KEY
        sync: false
